name: Build Gemini Deps for Termux
on: 
  workflow_dispatch:

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 3. Install Build Tools
        run: |
          pip install maturin
          rustup target add aarch64-linux-android

      - name: 4. Build Wheels (The Heavy Stuff)
        run: |
          mkdir -p dist
          
          # Download source pydantic-core
          pip download pydantic-core --no-binary :all:
          
          # Ekstrak file source
          tar -xvf pydantic_core-*.tar.gz
          
          # Masuk ke direktori hasil ekstrak
          cd pydantic_core-*/
          
          # SETTINGAN PENTING:
          # Kita paksa Maturin pakai Python host untuk proses build binding
          export PYO3_PYTHON=$(which python3)
          
          # PROSES MASAK:
          # --compatibility off: Biar dia nggak ngecek apakah whl bisa jalan di Ubuntu (jelas nggak bisa karena ini buat Android)
          # --strip: Biar ukuran file whl-nya kecil (penting buat RAM Hermes)
          maturin build --release --target aarch64-linux-android --out ../dist --compatibility off --strip
          
          cd ..
          
          # Ambil grpcio-status whl yang sudah jadi
          pip download grpcio-status --dest dist

      - name: 5. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-hermes-wheels
          path: dist/*.whl
