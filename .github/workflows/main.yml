name: Build Gemini Deps for Termux
on: 
  workflow_dispatch: # Tombol manual di tab Actions

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 3. Install Build Tools (Rust & Maturin)
        run: |
          # Install maturin untuk compile pydantic-core
          pip install maturin
          # Tambahkan target arsitektur Hermes (Android aarch64)
          rustup target add aarch64-linux-android

      - name: 4. Build Wheels (The Heavy Stuff)
        run: |
          mkdir -p dist
          
          # Download source pydantic-core terbaru
          pip download pydantic-core --no-binary :all:
          
          # Ekstrak file source-nya
          tar -xvf pydantic_core-*.tar.gz
          
          # Masuk ke direktori hasil ekstrak
          cd pydantic_core-*/
          
          # PROSES MASAK: Compile ke Android aarch64
          # -i python3: Kasih tahu maturin lokasi python (Fix error interpreter)
          # --release: Biar filenya kecil dan kencang
          maturin build --release --target aarch64-linux-android --out ../dist -i python3
          
          cd ..
          
          # Tambahan: Download grpcio-status (binary whl)
          pip download grpcio-status --dest dist

      - name: 5. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-hermes-wheels
          path: dist/*.whl
