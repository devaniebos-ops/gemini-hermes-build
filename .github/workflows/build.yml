name: Build Gemini Deps for Termux
on: 
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-pip
          pip install --upgrade pip
          pip install maturin
          rustup target add aarch64-linux-android

      - name: 3. Build Wheels (The Heavy Stuff)
        run: |
          mkdir -p dist
          pip download pydantic-core --no-binary :all:
          tar -xvf pydantic_core-*.tar.gz
          cd pydantic_core-*/
          
          # Paksa Maturin pake python3 bawaan sistem
          # Kita pakai flag --interpreter python3
          maturin build --release --target aarch64-linux-android --out ../dist --compatibility off --strip --interpreter python3
          
          cd ..
          pip download grpcio-status --dest dist

      - name: 4. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-hermes-wheels
          path: dist/*.whl
