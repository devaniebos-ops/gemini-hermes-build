name: Build Gemini Deps for Termux
on: 
  workflow_dispatch:

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 3. Install Build Tools
        run: |
          pip install maturin
          rustup target add aarch64-linux-android

      - name: 4. Build Wheels (The Heavy Stuff)
        run: |
          mkdir -p dist
          pip download pydantic-core --no-binary :all:
          tar -xvf pydantic_core-*.tar.gz
          cd pydantic_core-*/
          
          # Trik Linker: Biar maturin nemu 'python3.13'
          sudo ln -sf $(which python3) /usr/bin/python3.13
          
          # Build dengan flag yang sudah kita sempurnakan
          maturin build --release --target aarch64-linux-android --out ../dist --compatibility off --strip -i python3.13
          
          cd ..
          pip download grpcio-status --dest dist

      - name: 5. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-hermes-wheels
          path: dist/*.whl
